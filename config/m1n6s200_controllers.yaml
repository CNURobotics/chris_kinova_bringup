# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    mico_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    mico_finger_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

mico_arm_controller:
  ros__parameters:
    joints:
      - m1n6s200_joint_1
      - m1n6s200_joint_2
      - m1n6s200_joint_3
      - m1n6s200_joint_4
      - m1n6s200_joint_5
      - m1n6s200_joint_6
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity


mico_finger_controller:
  ros__parameters:
    joints:
      - m1n6s200_joint_finger_1
      - m1n6s200_joint_finger_2
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity

